name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/android-capacitor-app"
      - "feat/trading-green-money-icon"
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "package.json"
      - "capacitor.config.ts"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run calculation tests
        run: npm test
      - name: Prepare web assets
        run: npm run build:mobile
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply money-themed Android launcher icon
        run: node scripts/apply-android-icon.mjs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: options-lot-calculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
